[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-ai-agent"
version = "0.2.0"
description = "Durable, evidence-grounded CV generation service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "ruamel.yaml>=0.18.6",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
    "google-genai>=2.0.0",
    "jsonschema>=4.20.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.schemas" = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: requires a dedicated AI_TEST_DATABASE_URL PostgreSQL database"]
