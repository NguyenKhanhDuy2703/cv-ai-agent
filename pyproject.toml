[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-ai-agent"
version = "0.2.0"
description = "Autonomous AI Agent Service for Intelligent CV Creation & Optimization (YAML in -> YAML out)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sse-starlette>=2.1.0",
    "ruamel.yaml>=0.18.6",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
    "google-genai>=2.0.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
