name: cv-ai-agent

x-ai: &ai
  build: .
  environment:
    AI_DATABASE_URL: postgresql+psycopg://cv_ai:cv_ai_local@postgres:5432/cv_ai
    AI_PROVIDER: ${AI_PROVIDER:-gemini}
    AI_MODEL: ${AI_MODEL:-}
    AI_API_KEY: ${AI_API_KEY:-}
    AI_SECRET_KEY: ${AI_SECRET_KEY:-}
    AI_PORT: 8001
    AI_MAX_BODY_SIZE: ${AI_MAX_BODY_SIZE:-10485760}
    AI_WORKER_POLL_SECONDS: ${AI_WORKER_POLL_SECONDS:-1}
    AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-2}
    AI_JOB_TIMEOUT_SECONDS: ${AI_JOB_TIMEOUT_SECONDS:-120}
    AI_JOB_MAX_ATTEMPTS: ${AI_JOB_MAX_ATTEMPTS:-2}
    AI_LEASE_SECONDS: ${AI_LEASE_SECONDS:-30}
    AI_HEARTBEAT_SECONDS: ${AI_HEARTBEAT_SECONDS:-5}
    AI_RETENTION_HOURS: ${AI_RETENTION_HOURS:-24}
    AI_SSE_POLL_SECONDS: ${AI_SSE_POLL_SECONDS:-0.5}
    AI_SSE_HEARTBEAT_SECONDS: ${AI_SSE_HEARTBEAT_SECONDS:-15}
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cv_ai
      POSTGRES_PASSWORD: cv_ai_local
      POSTGRES_DB: cv_ai
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv_ai -d cv_ai"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    <<: *ai
    profiles: ["tools"]
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    command: ["uvicorn", "src.api.server:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    <<: *ai
    restart: unless-stopped
    command: ["python", "-m", "src.worker"]
    stop_grace_period: 15s

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: cv_ai_test
      POSTGRES_PASSWORD: cv_ai_test
      POSTGRES_DB: cv_ai_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv_ai_test -d cv_ai_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  ai-postgres:
